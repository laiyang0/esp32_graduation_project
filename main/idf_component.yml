  espressif/esp32-camera: ^2.1.5
  esp_mmap_assets: 1.*    #用于工程分区建立的组件

  espressif/esp_websocket_client: ^1.6.1

  espressif/esp_lvgl_port: ^2.7.2
  lvgl/lvgl: ^9.5.0
